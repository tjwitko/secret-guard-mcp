title = "secret-guard-mcp"

# Keep every one of gitleaks' ~170 built-in rules and add to them. Without this, defining any
# rule here would REPLACE the default set rather than extend it -- a config that looks like it
# tightened the scan while actually gutting it.
[extend]
useDefault = true

# Verified gap, not a speculative addition: gitleaks 8.30.1 with default rules does not flag
#   database_url: REDACTED_DSN_TEST_FIXTURE
# in a YAML file. A password inside a DSN is one of the most common ways a real credential ends
# up in a config file, so this closes it.
#
# secretGroup = 1 reports only the password, not the whole URI -- otherwise the host and username
# would be redacted along with it and the finding would be unreadable.
[[rules]]
id = "connection-string-password"
description = "Credential embedded in a connection string or URI (scheme://user:PASSWORD@host)"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/\s:@]{1,64}:([^\/\s:@]{4,128})@[^\/\s:@]+'''
secretGroup = 1
keywords = ["://"]

  [rules.allowlist]
  # Placeholders in documentation and templates, not credentials. Without these, every README
  # showing a connection-string format becomes a finding, and a scanner that fires on
  # documentation is one people turn off.
  regexes = [
    # $(VAR) alongside ${VAR}: Kubernetes expands $(VAR) in env values, and it is also Make and
    # shell command-substitution syntax. Missing it made a correct manifest
    # (postgresql://$(DB_USER):$(DB_PASS)@...) fail the commit gate as a hardcoded credential.
    '''(?i)^(password|pass|passwd|pwd|secret|changeme|example|placeholder|your[_-]?password|xxx+|\*+|<[^>]+>|\$\{[^}]+\}|\$\([^)]+\)|%[^%]+%|REPLACE[_A-Z]*)$''',
  ]

# Vendored dependency trees are not the caller's code, and a finding in one is unactionable:
# you cannot fix a credential inside terraform-aws-modules' example configs or inside a package
# in node_modules. This is not hypothetical -- a real agent run had its commit rejected four
# times over heuristic hits in .terraform/modules/eks.kms/examples/, spent ten turns trying to
# silence them (it wrote a .gitleaksignore, then a .gitignore, then just retried), and never
# recovered. Telling someone to fix code they do not own is the same failure terraform-guard's
# classifyValidationErrors exists to prevent.
#
# These directories are also not committed, so a real secret in one does not reach history
# through this repo.
[allowlist]
description = "Vendored dependency trees"
paths = [
  '''(^|/)\.terraform/''',
  # Checkov writes modules fetched with --download-external-modules here, inside the scanned
  # project rather than beside it. Its absence cost a benchmark run: 14 findings, every one in a
  # vendored terraform-aws-modules example, none in the model's own code -- and because the
  # pre-commit hook runs this scan, the commit could not be made either, so the run ended FAILED
  # on work that was fine.
  '''(^|/)\.external_modules/''',
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)\.venv/''',
  '''(^|/)__pycache__/''',
]
